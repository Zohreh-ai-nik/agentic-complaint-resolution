# Project configuration for tooling (ruff + pytest).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# A sensible, strict-but-friendly default set.
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = "test_*.py"
